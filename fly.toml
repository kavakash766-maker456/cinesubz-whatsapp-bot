app = "cinesubz-whatsapp-bot-94760"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7860"
  BOT_PHONE = "94760372547"
  TARGET_GROUP_JID = "120363419930344447@g.us"
  AUTH_DIR = "/app/auth_info"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "bot_auth_data"
  destination = "/app/auth_info"
  initial_size = "1gb"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
