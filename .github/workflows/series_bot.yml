name: FilmFeed Series Bot 24/7 (0782088603)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '45 */4 * * *'

concurrency:
  group: whatsapp-series-bot-instance
  cancel-in-progress: true

jobs:
  run-series-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pycryptodome requests beautifulsoup4 gdown telethon Pillow playwright playwright-stealth aiohttp aiofiles rich curl_cffi
          python -m playwright install chromium --with-deps

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Run FilmFeed Series Bot Engine
        env:
          BOT_PHONE: "94782088603"
          BOT_TYPE: "series"
          TARGET_GROUP_JID: "120363419930344447@g.us"
          TARGET_GROUP_JIDS: "120363419930344447@g.us,120363428509877949@g.us"
          AUTH_DIR: "auth_info_series"
          LOG_LEVEL: "info"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SESSION_VAULT_DESC: "filmfeed-whatsapp-auth-vault-series"
          USE_PAIRING_CODE: "true"
          RUNNER_LIFETIME_HOURS: "4.5"
        run: |
          mkdir -p auth_info_series temp
          START_TIME=$(date +%s)
          while true; do
            echo "🚀 Starting FilmFeed TV Series Bot Engine (0782088603)..."
            node src/index.js
            EXIT_CODE=$?
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            # Scheduled rotation handoff after ~4.5 hours (16200s):
            if [ $EXIT_CODE -eq 0 ] && [ $ELAPSED -ge 16200 ]; then
              echo "✅ Scheduled 4.5-hour runner rotation completed cleanly. Handing off to next 24/7 runner..."
              break
            fi

            # Prevent GitHub Actions hard kill
            if [ $ELAPSED -ge 17280 ]; then
              echo "⏳ Runner lifespan reached 4.8 hours. Handing off to next 24/7 runner..."
              break
            fi

            echo "⚠️ Series Bot exited with code $EXIT_CODE after ${ELAPSED}s. Restarting in 5s..."
            sleep 5
          done

      - name: Auto-Trigger Next 24/7 Series Session Runner
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🔄 Automatically queuing next continuous 24/7 series runner..."
          gh workflow run "FilmFeed Series Bot 24/7 (0782088603)" || curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/series_bot.yml/dispatches" -d '{"ref":"main"}' || true
