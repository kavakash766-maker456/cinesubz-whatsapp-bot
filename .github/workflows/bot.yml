name: FilmFeed WhatsApp Bot 24/7

on:
  workflow_dispatch:
    inputs:
      reset_bot:
        description: 'Force New QR Code for Bot (0760372547)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  schedule:
    - cron: '30 */4 * * *'

concurrency:
  group: whatsapp-bot-instance
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify System Dependencies
        run: |
          ffmpeg -version | head -n 1 || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          openssl version

      - name: Install Python Packages
        run: |
          pip install --no-cache-dir cryptography pycryptodome requests beautifulsoup4 gdown telethon Pillow playwright playwright-stealth aiohttp aiofiles rich curl_cffi
          python -m playwright install chromium

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Run FilmFeed Bot Engine (0760372547)
        env:
          BOT_PHONE: "94760372547"
          TARGET_GROUP_JID: "120363419930344447@g.us"
          TARGET_GROUP_JIDS: "120363419930344447@g.us,120363428509877949@g.us"
          LOG_LEVEL: "info"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SESSION_VAULT_ID: "8f37b6dbcf07ff6fab07b21cc8cbe05b"
          RESET_BOT: ${{ inputs.reset_bot || 'false' }}
          AUTH_DIR: "auth_info"
          RUNNER_LIFETIME_HOURS: "4.5"
        run: |
          mkdir -p auth_info temp
          START_TIME=$(date +%s)
          while true; do
            echo "🚀 Starting FilmFeed Bot Engine..."
            node src/index.js
            EXIT_CODE=$?
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            # Scheduled rotation handoff after ~4.5 hours (16200s):
            if [ $EXIT_CODE -eq 0 ] && [ $ELAPSED -ge 16200 ]; then
              echo "✅ Scheduled 4.5-hour runner rotation completed cleanly. Handing off to next 24/7 runner..."
              break
            fi

            # Prevent GitHub Actions hard kill
            if [ $ELAPSED -ge 17280 ]; then
              echo "⏳ Runner lifespan reached 4.8 hours. Handing off to next 24/7 runner..."
              break
            fi

            echo "⚠️ Bot process exited with code $EXIT_CODE after ${ELAPSED}s. Restarting in 5s..."
            sleep 5
          done

      - name: Auto-Trigger Next 24/7 Session Runner
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🔄 Automatically queuing next continuous 24/7 runner..."
          gh workflow run "FilmFeed WhatsApp Bot 24/7" || curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" -d '{"ref":"main"}' || true
