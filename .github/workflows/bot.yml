name: FilmFeed WhatsApp Bot 24/7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: whatsapp-bot-instance
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pycryptodome requests beautifulsoup4 gdown

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Run FilmFeed Bot Engine
        env:
          BOT_PHONE: "94760372547"
          TARGET_GROUP_JID: "120363419930344447@g.us"
          TARGET_GROUP_JIDS: "120363419930344447@g.us,120363428509877949@g.us"
          AUTH_DIR: "auth_info"
          LOG_LEVEL: "info"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SESSION_VAULT_ID: "8f37b6dbcf07ff6fab07b21cc8cbe05b"
        run: |
          mkdir -p auth_info temp
          while true; do
            echo "🚀 Starting FilmFeed Bot Engine..."
            node src/index.js || true
            echo "⚠️ Bot process stopped. Restarting automatically in 5 seconds..."
            sleep 5
          done

      - name: Auto-Trigger Next 24/7 Session Runner
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🔄 Automatically queuing next continuous 24/7 runner..."
          gh workflow run "FilmFeed WhatsApp Bot 24/7" || curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" -d '{"ref":"main"}' || true
